<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>运价采集编排器 · 群工作状态</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;color:#293242;background:#f5f6f8;font-size:14px}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{display:flex;flex-direction:column}header{flex-shrink:0;background:white;padding:18px 22px;border-bottom:1px solid #e9edf3}header h1{font-size:21px;margin:0 0 7px}header p{font-size:12px;color:#778396;margin:0}.top{display:flex;align-items:center;justify-content:space-between;gap:16px}.tag{font-size:11px;color:#7a8798}.summary{display:flex;gap:20px;align-items:center;margin-top:16px;flex-wrap:wrap}.metric{display:flex;gap:7px;align-items:baseline}.metric strong{font-size:23px;font-weight:600}.metric span{font-size:12px;color:#7a8798}main{flex:1;min-height:0;padding:16px 20px;display:flex;flex-direction:column}.layout{flex:1;min-height:0;display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px}.panel{min-height:0;min-width:0;background:white;border:1px solid #e9edf3;border-radius:14px;overflow:hidden;display:flex;flex-direction:column}.panel-head{padding:16px;border-bottom:1px solid #e9edf3;flex-shrink:0}h2{font-size:14px;margin:0}.filter{margin-top:12px;display:flex;justify-content:space-between;gap:8px;align-items:center}.muted{font-size:12px;color:#7a8798;line-height:1.7}.filter select,button{font:inherit;color:inherit;background:white;border:1px solid #e9edf3;border-radius:8px}select{padding:6px;font-size:11px!important}.run-list{flex:1;min-height:0;overflow:auto;padding:8px;overscroll-behavior:contain}.run{display:block;width:100%;text-align:left;padding:12px;border-color:transparent;margin-bottom:5px;cursor:pointer}.run:hover{background:#f7f9fc}.run.selected{background:#edf2ff;border-color:#dce6fc}.run strong{font-size:13px;font-weight:600;display:block;margin-bottom:8px}.run p{margin:5px 0 0;font-size:11px;color:#7a8798}.state{font-size:12px;color:#7a8798}.state.processing{color:#2b9677}.state.needs_review,.state.recovering{color:#b17d37}.detail-body{flex:1;min-height:0;overflow:auto;padding:20px;overscroll-behavior:contain}.description{font-size:12px;color:#7a8798;margin:8px 0 18px;line-height:1.7}.flow{display:flex;gap:8px;overflow:auto;margin:14px 0}.step{flex:1;min-width:96px;border:1px solid #e9edf3;border-top:3px solid #d0d7e2;border-radius:8px;padding:11px 9px;background:#f8f9fb}.step strong{font-size:12px;display:block;margin-bottom:7px}.step.SUCCEEDED{border-top-color:#2c997a}.step.RUNNING{border-top-color:#4677ee}.step.FAILED,.step.HELD,.step.RETRY_WAIT{border-top-color:#c69547}.step p{font-size:10px;margin:6px 0 0;color:#8a95a5}.error{background:#fff8ed;border:1px solid #eedfc6;color:#956d33;padding:12px 14px;border-radius:9px;line-height:1.7;font-size:12px;overflow-wrap:anywhere}.children{display:flex;flex-direction:column;gap:5px;margin:15px 0}.child{padding:10px 12px;text-align:left;cursor:pointer;font-size:12px}.children-heading{display:flex;gap:12px;align-items:center;margin:20px 0 10px}.children-heading select{margin-left:auto}.events{list-style:none;padding:0}.events li{padding:10px 0;border-bottom:1px solid #edf0f5;font-size:12px;line-height:1.7;overflow-wrap:anywhere}.events time{font-size:11px;color:#8a95a5;display:block}.empty{padding:25px;color:#8a95a5;font-size:13px}.footer{flex-shrink:0;font-size:11px;color:#8a95a5;margin-top:10px}details{font-size:12px;color:#7a8798;margin-top:20px}summary{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;background:#f8f9fb;padding:12px;max-height:280px;overflow:auto}:focus-visible{outline:2px solid #4677ee;outline-offset:2px}#business-progress{font-size:12px;color:#7a8798;margin:12px 0 0}.offline{color:#b56b38!important}@media(max-width:700px){header{padding:12px}header h1{font-size:18px}.summary{gap:12px;margin-top:12px}.metric strong{font-size:20px}.metric span{font-size:10px}.layout{grid-template-columns:1fr;grid-template-rows:minmax(140px,.65fr) minmax(0,1.6fr);gap:10px}main{padding:10px}.panel-head{padding:12px}.filter{margin-top:8px}.detail-body{padding:14px}.top{flex-wrap:wrap;gap:4px}.footer{display:none}}
</style></head><body><header><div class="top"><div><h1>运价采集编排器</h1><p>同群单轮处理 · 重复触发合并 · 异常自动恢复</p></div><span class="tag" id="connection" role="status">连接中</span></div><div class="summary" id="summary"></div><p id="business-progress">正在核对群状态</p></header><main><div class="layout"><section class="panel"><div class="panel-head"><h2>群工作状态</h2><div class="filter"><label class="muted"><input id="show-tests" type="checkbox"> 批次历史</label><select id="group-filter" aria-label="群状态筛选"><option value="">全部群</option><option value="processing">处理中</option><option value="recovering">自动恢复</option><option value="needs_review">有待核消息</option><option value="idle">空闲</option></select></div></div><div id="runs" class="run-list" tabindex="0" aria-label="群列表"></div></section><section class="panel"><div class="panel-head"><h2 id="title">选择群查看工作情况</h2></div><div class="detail-body"><p class="description" id="description">同群只保留当前处理与一次后续检查，历史触发不会堆成待办。</p><div class="flow" id="flow"></div><div id="errors"></div><div class="children-heading"><h2>源消息</h2><select id="child-filter" aria-label="消息状态筛选"><option value="open">未完成与待核</option><option value="all">全部消息</option></select></div><div class="children" id="children"></div><h2 style="margin-top:20px">最近动作</h2><ul class="events" id="events"></ul><details><summary>技术详情与交付回执</summary><pre id="artifacts"></pre></details></div></section></div><div class="footer" id="mode">状态来自持久记录 · 待核不等于已通过 · 水位只有完整读回后推进</div></main><script>
'use strict';
const POLL_SECONDS=3,MILLISECONDS_PER_SECOND=1000,ERROR_DISPLAY_LIMIT=200,RECENT_EVENT_LIMIT=20;
const labels={classify:'消息分类',vision:'原图识读',extract:'报价解析',inventory:'独立盘点',coverage:'覆盖检查',audit:'独立复核',prepare:'证据快照',pull:'拉取新消息',fanout:'消息分发',normalize:'字段转换',validate:'预校验',submit:'送入待审核',readback:'交付读回',reconcile:'交付对账',watermark:'提交水位'};
const states={QUEUED:'等待前序步骤',RUNNING:'处理中',RETRY_WAIT:'自动重试',FAILED:'异常待核',SUCCEEDED:'已完成',SKIPPED:'已确认非报价',DONE:'交付完成',BLOCKED:'有待核消息',WAITING_CHILDREN:'消息处理中',HELD:'水位保留',NEEDS_REVIEW:'待核已隔离',COALESCED:'触发已合并'};
const groupStates={processing:'处理中',recovering:'冷却后自动恢复',waiting:'等待执行',needs_review:'有待核消息',idle:'空闲'};
const $=id=>document.getElementById(id),el=(tag,text,cls)=>{const n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;return n};
let selected='',groups=[],all=[],current=null,health=null,busy=false,again=false;
const shorten=value=>String(value||'').slice(0,ERROR_DISPLAY_LIMIT);
async function json(response){const r=await response,v=await r.json();if(!r.ok||!v.ok)throw Error(v.error||'接口失败');return v.data}
function renderList(){const history=$('show-tests').checked,filter=$('group-filter').value;const items=history?all:groups.filter(g=>!filter||g.status===filter||(filter==='needs_review'&&g.failed_messages));const existing=new Map([...$('runs').children].map(n=>[n.dataset.id,n]));const nodes=items.map(item=>{const id=history?item.id:item.run_id;let n=existing.get(id);if(!n){n=el('button','');n.dataset.id=id;n.onclick=()=>{selected=id;current=null;renderList();refresh()}}n.className='run'+(id===selected?' selected':'');const headline=history?item.lane:item.name,state=history?states[item.status]:groupStates[item.status],note=history?new Date(item.created*MILLISECONDS_PER_SECOND).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'}):[item.running_messages?item.running_messages+' 条正在处理':'',item.failed_messages?item.failed_messages+' 条证据待核':'',item.followup?'已合并一次后续检查':'',!item.running_messages&&!item.failed_messages&&!item.followup?'下一次触发自动检查':''].filter(Boolean).join(' · ');const signature=JSON.stringify([headline,state,note,id===selected]);if(n.dataset.signature!==signature){n.replaceChildren(el('strong',headline),el('span',state,'state '+(item.status||'')),el('p',note));n.dataset.signature=signature}return n});let cursor=$('runs').firstChild;for(const n of nodes){if(n===cursor)cursor=cursor.nextSibling;else $('runs').insertBefore(n,cursor)}while(cursor){const next=cursor.nextSibling;cursor.remove();cursor=next}if(!nodes.length)$('runs').append(el('div','暂无符合条件的群','empty'))}
function renderDetail(){if(!current)return;const r=current,g=groups.find(g=>g.run_id===r.id);$('title').textContent=(g?g.name:r.lane)+' · '+(g?groupStates[g.status]:states[r.status]);$('description').textContent=g?[(g.running_messages?'正在处理 '+g.running_messages+' 条消息。':'同群不会重复启动解析。'),g.failed_messages?'有 '+g.failed_messages+' 条证据待核，保留原始来源及水位，其他新消息继续处理。':'完成交付读回后才推进水位。',g.followup?'重复触发已合并为一次后续检查。':''].join(' '):r.mode==='production-message'?'源消息 '+r.message_id+' · 相同消息复用持久记录与交付回执':'历史记录保留，不代表当前仍在执行。';$('flow').replaceChildren(...r.tasks.map(t=>{const n=el('div','','step '+t.status);n.append(el('strong',labels[t.stage]||t.stage),el('span',states[t.status]||t.status,'state'));return n}));$('errors').replaceChildren(...r.tasks.filter(t=>t.error&&t.status!=='COALESCED').map(t=>el('p',shorten(t.error),'error')));const children=(r.children||[]).filter(c=>$('child-filter').value==='all'||c.failed||c.waiting);$('children').replaceChildren(...children.map(c=>{const n=el('button',(c.failed?'待核':c.waiting?'处理中 / 等待执行':'已完成')+' · '+c.lane.split(':').slice(2).join(':'),'child');n.onclick=()=>{selected=c.id;current=null;refresh()};return n}));if(!children.length)$('children').append(el('span',(r.children||[]).length?'本轮未完成消息为 0；可切换查看全部消息':'暂无源消息','muted'));$('events').replaceChildren(...r.events.slice(-RECENT_EVENT_LIMIT).reverse().map(e=>{const n=el('li','');n.append(el('span',(labels[e.stage]||e.stage)+' · '+shorten(e.message)),el('time',new Date(e.at*MILLISECONDS_PER_SECOND).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'})));return n}));$('artifacts').textContent=JSON.stringify({run_id:r.id,status:r.status,tasks:r.tasks},null,2)}
async function refresh(){if(busy){again=true;return}busy=true;try{health=await json(fetch('/api/health'));groups=health.groups||[];if($('show-tests').checked||!groups.length){all=await json(fetch('/api/runs'));if(!groups.length)$('show-tests').checked=true}const valid=$('show-tests').checked?all:groups;if(!selected)selected=valid[0]?.id||valid[0]?.run_id||'';renderList();const counts=[['群总数',groups.length],['处理中',groups.filter(g=>g.status==='processing').length],['自动恢复',groups.filter(g=>g.status==='recovering').length],['待核消息',health.queue?.messages?.FAILED||0]];$('summary').replaceChildren(...counts.map(([label,count])=>{const n=el('div','','metric');n.append(el('strong',count),el('span',label));return n}));$('business-progress').textContent=(health.worker_alive?'执行器在线':'执行器未确认在线')+' · '+(health.production_cutover?'自动采集已接管':'只读回放 / 尚未接管')+' · 重复触发自动合并，异常消息保留待核';if(selected){const target=selected,detail=await json(fetch('/api/run?id='+encodeURIComponent(target)));if(selected===target){current=detail;renderDetail()}else again=true}$('connection').textContent='已同步 '+new Date().toLocaleTimeString('zh-CN',{timeZone:'Asia/Shanghai'});$('connection').className='tag'}catch(e){$('connection').textContent='连接中断 · 自动重连';$('connection').className='tag offline';console.error('[GROUP-MONITOR]',e)}finally{busy=false;if(again){again=false;refresh()}}}
$('show-tests').onchange=()=>{selected='';refresh()};$('group-filter').onchange=renderList;$('child-filter').onchange=renderDetail;refresh();setInterval(refresh,POLL_SECONDS*MILLISECONDS_PER_SECOND);
</script></body></html>
